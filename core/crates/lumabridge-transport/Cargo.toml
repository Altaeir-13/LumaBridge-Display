[package]
name = "lumabridge-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Encrypted QUIC/TLS 1.3 and TCP/TLS 1.3 operational transport, discovery, DPLPMTUD, backpressure, and GOP recovery for LumaBridge."

[dependencies]
bytes = "1"
lumabridge-protocol = { version = "0.1.0", path = "../lumabridge-protocol" }
lumabridge-security = { version = "0.1.0", path = "../lumabridge-security", features = ["quic"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1.16.0", features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
zeroize = { version = "1.9.2", features = ["derive"] }

[[bench]]
name = "transport_bench"
harness = false
