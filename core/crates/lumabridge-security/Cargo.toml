[package]
name = "lumabridge-security"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cryptographic identity, channel-bound pairing, trust store, and authorization policy for LumaBridge."

[dependencies]
der = { version = "0.8", features = ["alloc", "derive", "oid"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
getrandom = { version = "0.4.3", features = ["sys_rng"] }
lumabridge-protocol = { version = "0.1.0", path = "../lumabridge-protocol" }
rand_core = "0.10.1"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1.16.0", features = ["std"] }
sha2 = { version = "0.11.2", default-features = false, features = ["zeroize"] }
subtle = { version = "2.6.1", default-features = false }
time = { version = "0.3", default-features = false, features = ["std"] }
x509-cert = { version = "0.3.1", default-features = false, features = ["std"] }
zeroize = { version = "1.9.2", features = ["derive"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[[bench]]
name = "security_bench"
harness = false
