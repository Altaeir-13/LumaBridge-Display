language = "C"
cpp_compat = true
include_guard = "LUMABRIDGE_FFI_H"
autogen_warning = "/* Autogenerated by cbindgen from lumabridge-ffi (M1.1 PoC). Do not edit manually. */"
style = "both"
usize_is_size_t = true

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[defines]
"feature = poc-fault-injection" = "LUMABRIDGE_FFI_POC_FAULT_INJECTION"

[export]
include = [
  "LbCoreHandle",
  "LbStatus",
  "LbCoreState",
  "LbEncodedCodec",
  "LbAbiHeader",
  "LbBufferReleaseFn",
  "LbOwnedBuffer",
  "LbEncodedFrameMeta",
  "LbOutputPacketCallback",
  "LbStateChangeCallback",
  "LbCoreConfig",
  "LbCoreMetrics",
  "LbGlobalResourceCounters",
  "LbAbiLayoutSignature",
  "LbNodeHandle",
  "LbNodeRole",
  "LbNodeTransportKind",
  "LbNodeConfig",
  "LbNodeTelemetry",
  "LbHostSessionHandle",
  "LbReceiverSessionHandle",
  "LbHostConnectConfig",
  "LbHostFeedback",
  "LbPairingAuthMode",
  "LbPairingApprovalPrompt",
  "LbPairingApprovalDecision",
  "LbPairingApprovalCallback",
  "LB_PERM_EXTEND_DISPLAY",
  "LbReceiverStartConfig",
  "LbReceiverEndpoints",
  "LbReceiverEventKind",
  "LbReceiverMediaEvent",
]
