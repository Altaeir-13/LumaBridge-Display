[workspace]
resolver = "2"
members = [
    "crates/lumabridge-core",
    "crates/lumabridge-ffi",
    "crates/lumabridge-protocol",
]
exclude = [
    "crates/lumabridge-protocol/fuzz",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Altaeir-13/LumaBridge-Display"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "thin"
codegen-units = 1
